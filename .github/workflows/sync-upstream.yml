name: Sync Latest Version

on:
  schedule:
    # GitHub Actions 使用 UTC；台灣時間每天 04:15 執行。
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # 官方 repository 不需要同步自己；Deploy to Cloudflare 建立的副本才會執行。
    if: github.repository != 'TedLin1993/taiwan-fin-hub' && github.repository != 'TedLin1993/all-set-tw'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

           - name: Sync upstream main safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "taiwan-fin-hub-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 永遠下載作者最新版 updater 到暫存區，不修改 repository 內的程式碼。
          updater="$RUNNER_TEMP/sync-upstream.mjs"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/TedLin1993/all-set-tw/main/scripts/sync-upstream.mjs" \
            --output "$updater"

          # Cloudflare Deploy to Cloudflare 會修改 wrangler.toml
          # 首次版本辨識時忽略該檔，避免把正常的部署客製化誤判成未知版本。
          sed -i \
            's/if (!path.startsWith(WORKFLOW_PREFIX)) {/if (!path.startsWith(WORKFLOW_PREFIX) \&\& path !== "wrangler.toml") {/' \
            "$updater"

          # 若作者日後改變程式結構，寧可停止，不要在未確認下繼續同步。
          if ! grep -q 'path !== "wrangler.toml"' "$updater"; then
            echo "無法安全套用 Cloudflare 部署相容修正，停止同步。"
            exit 1
          fi

          node "$updater"
