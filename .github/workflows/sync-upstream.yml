name: Diagnose Upstream Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find closest upstream version
        shell: bash
        run: |
          set -euo pipefail

          git remote remove upstream-debug 2>/dev/null || true
          git remote add upstream-debug https://github.com/TedLin1993/all-set-tw.git
          git fetch --no-tags upstream-debug main

          root="$(git rev-list --max-parents=0 HEAD | head -n 1)"

          echo "Deployment root commit: $root"
          echo "Searching for the closest upstream version..."

          best=""
          best_count=999999

          while read -r commit; do
            count="$(
              git diff --name-only "$root" "$commit" -- \
                . \
                ':(exclude).github/workflows/**' \
              | sed '/^$/d' \
              | wc -l
            )"

            if [ "$count" -lt "$best_count" ]; then
              best_count="$count"
              best="$commit"
            fi
          done < <(git rev-list upstream-debug/main)

          echo
          echo "Closest upstream commit: $best"
          echo "Different file count: $best_count"
          echo
          echo "=== Different paths ==="

          git diff --name-status "$root" "$best" -- \
            . \
            ':(exclude).github/workflows/**'
