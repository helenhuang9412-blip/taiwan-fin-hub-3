name: Sync Latest Version

on:
  schedule:
    # GitHub Actions 使用 UTC；台灣時間每天 04:15 執行。
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'TedLin1993/taiwan-fin-hub' && github.repository != 'TedLin1993/all-set-tw'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream main safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "taiwan-fin-hub-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 每次使用作者最新版同步器，但不寫入 repository。
          updater="$RUNNER_TEMP/sync-upstream.mjs"

          curl --proto '=https' --tlsv1.2 \
            --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/TedLin1993/all-set-tw/main/scripts/sync-upstream.mjs" \
            --output "$updater"

          # Cloudflare 一鍵部署會改動 package.json 與 wrangler.toml。
          # 只在「首次版本辨識」時忽略這兩個部署差異。
          python3 - "$updater" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = 'if (!path.startsWith(WORKFLOW_PREFIX)) {'
          new = 'if (!path.startsWith(WORKFLOW_PREFIX) && path !== "package.json" && path !== "wrangler.toml") {'

          if old not in text:
              raise SystemExit(
                  "作者的同步器結構已改變，無法安全套用 Cloudflare 相容修正。"
              )

          path.write_text(text.replace(old, new, 1))
          PY

          grep -q 'path !== "package.json"' "$updater"
          grep -q 'path !== "wrangler.toml"' "$updater"

          node "$updater"
